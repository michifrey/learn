<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" fill="white"/><text x="50" y="55" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="30">Satzgrenzen sichtbar machen</text><text x="55" y="135" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="28">Wir bleiben hier</text><text x="335" y="135" fill="#AA5040" font-family="DejaVu Sans,sans-serif" font-size="38">,</text><text x="365" y="135" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="28">weil es regnet.</text><text x="55" y="235" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="28">Das Buch</text><text x="235" y="235" fill="#AA5040" font-family="DejaVu Sans,sans-serif" font-size="38">,</text><text x="265" y="235" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="28">das ich lese</text><text x="490" y="235" fill="#AA5040" font-family="DejaVu Sans,sans-serif" font-size="38">,</text><text x="520" y="235" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="28">ist spannend.</text><text x="55" y="335" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="28">Brot</text><text x="143" y="335" fill="#AA5040" font-family="DejaVu Sans,sans-serif" font-size="38">,</text><text x="175" y="335" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="28">Käse und Obst</text><text x="55" y="430" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="25">Nicht nach Gefühl: Bestimme zuerst die Regel.</text></svg>