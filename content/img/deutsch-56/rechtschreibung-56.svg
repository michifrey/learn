<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" fill="white"/><text x="60" y="60" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="32">Welche Probe hilft?</text><text x="60" y="140" fill="#285D9A" font-family="DejaVu Sans,sans-serif" font-size="30">das</text><text x="240" y="140" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="27">dieses / welches / ein</text><text x="60" y="220" fill="#AA5040" font-family="DejaVu Sans,sans-serif" font-size="30">dass</text><text x="240" y="220" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="27">keine solche Ersatzprobe</text><text x="60" y="320" fill="#285D9A" font-family="DejaVu Sans,sans-serif" font-size="30">ihr seid</text><text x="330" y="320" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="27">Verb: sein</text><text x="60" y="405" fill="#AA5040" font-family="DejaVu Sans,sans-serif" font-size="30">seit gestern</text><text x="330" y="405" fill="#25483D" font-family="DejaVu Sans,sans-serif" font-size="27">Zeit: Seit wann?</text></svg>