<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" fill="white"/><g stroke="#466D60" stroke-width="3" stroke-linejoin="round"><text x="60" y="55" fill="#285D9A" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="25">Begleitsatz vorne</text><text x="70" y="112" fill="#285D9A" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="29">Lea sagt:</text><text x="245" y="112" fill="#9C5345" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="29">«Ich komme.»</text><text x="60" y="205" fill="#285D9A" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="25">Begleitsatz hinten</text><text x="70" y="263" fill="#9C5345" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="29">«Ich komme»,</text><text x="340" y="263" fill="#285D9A" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="29">sagt Lea.</text><text x="60" y="356" fill="#285D9A" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="25">Begleitsatz mittendrin</text><text x="70" y="416" fill="#9C5345" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="29">«Ich»,</text><text x="200" y="416" fill="#285D9A" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="29">sagt Lea,</text><text x="410" y="416" fill="#9C5345" stroke="none" font-family="DejaVu Sans,sans-serif" font-size="29">«komme gleich.»</text></g></svg>